name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rada
          POSTGRES_PASSWORD: rada_ci_password
          POSTGRES_DB: rada
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rada" --health-interval 3s --health-timeout 3s
          --health-retries 20
    env:
      RADA_ENVIRONMENT: test
      RADA_DATABASE_URL: postgresql+psycopg://rada:rada_ci_password@localhost:5432/rada
      RADA_TEST_DATABASE_URL: postgresql+psycopg://rada:rada_ci_password@localhost:5432/rada
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m scripts.export_contracts --check
      - run: alembic upgrade head
      - run: pytest -q
      - run: python -m app.workers.main --once

  edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait db api worker
      - run: curl --fail --silent http://localhost:8000/health/ready
      - if: always()
        run: docker compose logs --no-color && docker compose down -v
